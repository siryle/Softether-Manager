# Build and publish a release on every tag.
#
# Tagged builds use the exact tag; other builds read VERSION, which the
# repository's pre-commit hook increments with each change.
#
# On a pushed tag this builds the frontend, packages the one release tarball
# (Go binaries + built frontend + scripts + VERSION), and attaches it and
# its checksum to a GitHub release marked latest -- which is what
# `--version latest` and `sem update` resolve to.
#
# On a branch push or a pull request it builds and packages the same way but
# publishes nothing, so a break is caught before a tag depends on it.
name: release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build the release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `git describe` can name the version from tags.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine the version
        id: version
        run: |
          VERSION="$(bash scripts/version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $(git rev-parse HEAD)"

      - name: Lint the shell scripts
        run: |
          bash -n .githooks/* scripts/*.sh scripts/sem docker/docker-entrypoint.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=warning .githooks/* scripts/*.sh scripts/sem docker/docker-entrypoint.sh || true
          fi

      - name: Test installer security
        run: python3 scripts/test-install.py

      - name: Test commit versioning
        run: bash scripts/test-version.sh

      - name: Test and vet the Go backend
        run: |
          go test -race ./...
          go vet ./...

      - name: Install frontend dependencies
        working-directory: app/web
        run: npm ci

      - name: Test frontend behavior
        working-directory: app/web
        run: npm test

      - name: Build the frontend
        working-directory: app/web
        run: npm run build

      - name: Package the release tarball
        run: bash scripts/build-release.sh --version "${{ steps.version.outputs.version }}" --output dist/release --skip-frontend

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/release/softether-manager.tar.gz
            dist/release/softether-manager.tar.gz.sha256
